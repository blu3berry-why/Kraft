name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          CURRENT=$(jq -r '.["."]' .release-please-manifest.json)
          SUFFIX=$(echo "$CURRENT" | sed 's/^[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*//')
          NUMERIC=$(echo "$CURRENT" | sed 's/-[A-Za-z].*//')
          MAJOR=$(echo "$NUMERIC" | cut -d. -f1)
          MINOR=$(echo "$NUMERIC" | cut -d. -f2)
          PATCH=$(echo "$NUMERIC" | cut -d. -f3)

          # Release tags live on release-branch (not on main), so picking the
          # latest tag by ancestor reachability returns nothing here and the
          # bump would be driven by the full history. Pick the most recent
          # stable release tag globally by version sort instead. Restrict to
          # bare MAJOR.MINOR.PATCH so leftover experimental tags (v*, -RC*,
          # -Alpha*, -test*) don't sort on top and pull in years of history.
          git fetch --tags --force --quiet
          LAST_TAG=$(git for-each-ref --sort=-v:refname \
            --format='%(refname:short)' 'refs/tags/[0-9]*' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n1)
          # GitHub squash-merges put each PR's individual commit messages in
          # the squash commit body, while the subject defaults to the PR title
          # (which can be the branch name when the merger forgets to normalise
          # it). Reading only `--oneline` therefore misses `feat:` markers
          # buried in the body and produces a patch bump for what is really a
          # minor release. Read subject + body so the bump tracks the actual
          # change category regardless of squash-title hygiene.
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:'%s%n%b')
          else
            COMMITS=$(git log --pretty=format:'%s%n%b')
          fi

          if echo "$COMMITS" | grep -qE '^\* [a-z]+(\([^)]+\))?!:|^[a-z]+(\([^)]+\))?!:|BREAKING CHANGE'; then
            NEXT="$((MAJOR+1)).0.0${SUFFIX}"
          elif echo "$COMMITS" | grep -qE '^\* feat(\([^)]+\))?:|^feat(\([^)]+\))?:'; then
            NEXT="${MAJOR}.$((MINOR+1)).0${SUFFIX}"
          else
            NEXT="${MAJOR}.${MINOR}.$((PATCH+1))${SUFFIX}"
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: git checkout -b "release/${{ steps.version.outputs.next }}"

      - name: Bump version in files
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          jq --arg v "$VERSION" '.["."] = $v' .release-please-manifest.json > tmp.json && mv tmp.json .release-please-manifest.json
          sed -i "s/kraft\.version=.*/kraft.version=$VERSION/" gradle.properties

      - name: Commit and push
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          git add .release-please-manifest.json gradle.properties
          git commit -m "chore: release $VERSION"
          git push --force-with-lease origin "HEAD:release/$VERSION"

      - name: Build PR body
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          CURRENT="${{ steps.version.outputs.current }}"
          # Release tags are created on release-branch by publish.yml, so they
          # are not ancestors of main. `git describe HEAD^` therefore returns
          # nothing on a fresh release/<v> branch off main, which previously
          # caused the range to collapse to "HEAD^" and dump the entire
          # repository history into the PR body. Pick the most recent stable
          # release tag globally; restrict to bare MAJOR.MINOR.PATCH so old
          # experimental tags (v*, -RC*, -Alpha*, -test*) don't sort on top
          # and re-surface years of fixes.
          git fetch --tags --force --quiet
          LAST_TAG=$(git for-each-ref --sort=-v:refname \
            --format='%(refname:short)' 'refs/tags/[0-9]*' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n1)
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD^"
          else
            RANGE="HEAD^"
          fi

          # Read subject + body (same reason as the version-compute step):
          # GitHub squash-merges hide individual feat/fix messages inside the
          # squash body, so reading only subjects produces a changelog that
          # lists "fix-reverse-and-nested-mapping-update-docs (#49)" instead
          # of the actual feats and fixes the PR contained. Extract both the
          # subject form (`feat: ...`) and the squash-body bullet form
          # (`* feat: ...`), normalise to a `- ` bullet, and dedupe while
          # preserving order so duplicate bullets across reused PR branches
          # don't multiply.
          ALL=$(git log $RANGE --pretty=format:'%s%n%b')
          FEATS=$(echo "$ALL" \
            | grep -E '^\* feat(\([^)]+\))?:|^feat(\([^)]+\))?:' \
            | sed -E 's/^\*[[:space:]]*//; s/^/- /' \
            | awk '!seen[$0]++' || true)
          FIXES=$(echo "$ALL" \
            | grep -E '^\* fix(\([^)]+\))?:|^fix(\([^)]+\))?:' \
            | sed -E 's/^\*[[:space:]]*//; s/^/- /' \
            | awk '!seen[$0]++' || true)

          {
            echo "## Release ${VERSION}"
            echo ""
            echo "Bumped from \`${CURRENT}\` → \`${VERSION}\`"
            if [ -n "$FEATS" ]; then
              echo ""
              echo "### Features"
              echo "$FEATS"
            fi
            if [ -n "$FIXES" ]; then
              echo ""
              echo "### Bug Fixes"
              echo "$FIXES"
            fi
          } > /tmp/pr-body.md

      - name: Reset release-branch to main
        run: git push --force-with-lease origin HEAD~1:release-branch

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base release-branch \
            --head "release/${{ steps.version.outputs.next }}" \
            --title "Release ${{ steps.version.outputs.next }}" \
            --body-file /tmp/pr-body.md
