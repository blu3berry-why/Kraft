name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Sonar needs full history for blame/new-code detection.
          fetch-depth: 0
          # Nothing after checkout needs the git token; don't leave it in .git config.
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and generate coverage report
        run: ./gradlew build koverXmlReport

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR }}
        run: ./gradlew sonar --stacktrace \
          -Dsonar.projectKey=${{ secrets.PROJECT_KEY }} \
          -Dsonar.organization=${{ secrets.ORG_NAME }} \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
