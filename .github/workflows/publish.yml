name: Publish

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Publish to GitHub Packages
        run: ./gradlew :kraft-ksp:publish :kraft-annotations:publish --no-configuration-cache
          -Pkraft.version=${GITHUB_REF_NAME#v}
          -Pgpr.user=${{ github.actor }}
          -Pgpr.token=${{ secrets.GITHUB_TOKEN }}
