name: Deploy Docs

# Docs deploy by manual dispatch, after the release is on Maven Central. Stable
# publishing is USER_MANAGED: publish.yml uploads to the Central Portal, where
# the artifacts wait until the maintainer clicks Publish. Deploying on the
# GitHub Release would document a version consumers cannot resolve yet.
# So: click Publish on the Central Portal, then run this workflow (Actions ->
# Deploy Docs -> Run workflow) with the release tag, e.g. 0.14.0. It checks
# out that tag, so the site always matches the released code. Pre-release tags
# (containing '-') are skipped and never overwrite the stable site.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to deploy (e.g. 0.14.0)'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Pre-releases (e.g. 0.14.0-RC1) must not overwrite the stable docs site.
    # Guard on the tag name: stable tags never contain '-', pre-release tags
    # always do.
    if: ${{ !contains(inputs.ref, '-') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # This job doesn't push; don't leave the token in .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install mkdocs-material
        run: pip install mkdocs-material "mkdocs<2"

      - name: Build site
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
