name: Deploy Docs

# Docs deploy on release (not on every main push): the site documents released
# artifacts, and deploying docs for merged-but-unreleased features would
# advertise APIs that aren't on Maven Central yet. The release event checks out
# the tagged commit, so the site always matches the released code.
# workflow_dispatch stays as the escape hatch for urgent docs-only fixes
# between releases (deploys main HEAD — check it doesn't document unreleased
# features first).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Pre-releases (e.g. 0.14.0-RC1) must not overwrite the stable docs site.
    # publish-rc.yml never creates a GitHub Release, so this guard is a backstop.
    # Guard on the tag name, not github.event.release.prerelease: stable tags
    # never contain '-', pre-release tags always do, and the flag would need
    # release-please's `prerelease` option — which also flags every pre-major
    # (0.x) release, so it cannot be used while Kraft is pre-1.0.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.release.tag_name, '-')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mkdocs-material
        run: pip install mkdocs-material "mkdocs<2"

      - name: Build site
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
