name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.15-Alpha)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: git checkout -b release/${{ inputs.version }}

      - name: Bump version
        run: sed -i "s/kraft.version=.*/kraft.version=${{ inputs.version }}/" gradle.properties

      - name: Commit and push release branch
        run: |
          git add gradle.properties
          git commit -m "Release v${{ inputs.version }}"
          git push origin release/${{ inputs.version }}

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base release \
            --head release/${{ inputs.version }} \
            --title "Release v${{ inputs.version }}" \
            --body "Automated release PR for version ${{ inputs.version }}"
