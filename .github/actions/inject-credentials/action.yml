name: Inject publish credentials
description: Appends publishing credentials to gradle.properties and imports GPG key

inputs:
  gpr-user:
    description: GitHub Packages username
    required: true
  gpr-token:
    description: GitHub Packages token
    required: true
  gpg-private-key:
    description: ASCII-armored GPG private key
    required: true
  gpg-key-id:
    description: GPG signing key ID
    required: true
  gpg-passphrase:
    description: GPG signing passphrase
    required: true
  maven-central-username:
    description: Maven Central username
    required: true
  maven-central-password:
    description: Maven Central password
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
      run: |
        gpg --version | head -1
        mkdir -p ~/.gnupg
        chmod 700 ~/.gnupg
        echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
        echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
        gpgconf --kill gpg-agent || true
        echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>&1
        echo "Imported keys:"
        gpg --list-secret-keys --keyid-format short

    - shell: bash
      env:
        GPR_USER: ${{ inputs.gpr-user }}
        GPR_TOKEN: ${{ inputs.gpr-token }}
        GPG_KEY_ID: ${{ inputs.gpg-key-id }}
        GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
        MAVEN_USER: ${{ inputs.maven-central-username }}
        MAVEN_PASS: ${{ inputs.maven-central-password }}
      run: |
        {
          printf 'gpr.user=%s\n' "$GPR_USER"
          printf 'gpr.token=%s\n' "$GPR_TOKEN"
          printf 'signing.gnupg.keyName=%s\n' "$GPG_KEY_ID"
          printf 'signing.gnupg.passphrase=%s\n' "$GPG_PASSPHRASE"
          printf 'maven.central.username=%s\n' "$MAVEN_USER"
          printf 'maven.central.password=%s\n' "$MAVEN_PASS"
        } >> gradle.properties
