name: Inject publish credentials
description: Appends publishing credentials to gradle.properties and imports GPG key

inputs:
  gpr-user:
    description: GitHub Packages username
    required: true
  gpr-token:
    description: GitHub Packages token
    required: true
  gpg-private-key:
    description: GPG private key (base64-encoded or ASCII-armored)
    required: true
  gpg-key-id:
    description: GPG signing key ID
    required: true
  gpg-passphrase:
    description: GPG signing passphrase
    required: true
  maven-central-username:
    description: Maven Central username
    required: true
  maven-central-password:
    description: Maven Central password
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
      run: |
        set -euo pipefail
        gpg --version | head -1
        mkdir -p ~/.gnupg
        chmod 700 ~/.gnupg
        printf '%s\n' "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
        printf '%s\n' "pinentry-mode loopback" > ~/.gnupg/gpg.conf
        gpgconf --kill gpg-agent || true

        # Import GPG key — auto-detect ASCII-armored vs base64-encoded
        KEY_FILE=$(mktemp)
        trap "rm -f '$KEY_FILE'" EXIT

        if printf '%s' "$GPG_PRIVATE_KEY" | grep -q -- '-----BEGIN PGP'; then
          printf '%s\n' "$GPG_PRIVATE_KEY" > "$KEY_FILE"
        else
          # base64 decode: try GNU (-d) then BSD/macOS (-D)
          if ! printf '%s' "$GPG_PRIVATE_KEY" | base64 -d > "$KEY_FILE" 2>/dev/null; then
            printf '%s' "$GPG_PRIVATE_KEY" | base64 -D > "$KEY_FILE" 2>/dev/null
          fi
        fi

        gpg --batch --import "$KEY_FILE" 2>&1
        rm -f "$KEY_FILE"

        # Validate import succeeded
        echo "Imported keys:"
        gpg --list-secret-keys --keyid-format short

        KEY_COUNT=$(gpg --list-secret-keys --with-colons 2>/dev/null | grep -c '^sec:' || true)
        if [ "$KEY_COUNT" -eq 0 ]; then
          echo "::error::GPG key import failed — no secret keys in keyring. Check that GPG_PRIVATE_KEY secret is set and valid (ASCII-armored or base64-encoded)."
          exit 1
        fi
        echo "Successfully imported $KEY_COUNT secret key(s)."

    - shell: bash
      env:
        GPR_USER: ${{ inputs.gpr-user }}
        GPR_TOKEN: ${{ inputs.gpr-token }}
        GPG_KEY_ID: ${{ inputs.gpg-key-id }}
        GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
        MAVEN_USER: ${{ inputs.maven-central-username }}
        MAVEN_PASS: ${{ inputs.maven-central-password }}
      run: |
        {
          printf 'gpr.user=%s\n' "$GPR_USER"
          printf 'gpr.token=%s\n' "$GPR_TOKEN"
          printf 'signing.gnupg.keyName=%s\n' "$GPG_KEY_ID"
          printf 'signing.gnupg.passphrase=%s\n' "$GPG_PASSPHRASE"
          printf 'maven.central.username=%s\n' "$MAVEN_USER"
          printf 'maven.central.password=%s\n' "$MAVEN_PASS"
        } >> gradle.properties
